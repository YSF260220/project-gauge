<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 기여도 평가 관리</title>
    <!-- Firebase 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- SheetJS (xlsx) 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        *{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#182033;font-family:Arial,"Noto Sans KR",sans-serif} 
        button,input,select{font:inherit} button{cursor:pointer;border:0} .app{display:flex;min-height:100vh} 
        .sidebar{width:225px;background:#171b3a;color:#fff;flex:none} .logo{padding:22px;font-size:20px;font-weight:800;border-bottom:1px solid #ffffff22} 
        .logo span{color:#a5b4fc} .nav{padding:14px 10px} .nav button{display:block;width:100%;padding:13px;margin:4px 0;border-radius:8px;text-align:left;color:#c7d2fe;background:transparent} 
        .nav button.active,.nav button:hover{background:#30366c;color:#fff} .main{flex:1;min-width:0} 
        .topbar{min-height:68px;padding:12px 28px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap} 
        .container{padding:20px} .btn{padding:8px 16px;border-radius:6px;background:#4f46e5;color:#fff;font-weight:600} 
        .btn.secondary{background:#e5e7eb;color:#374151} .btn.danger{background:#ef4444;color:#fff} .btn.small{padding:3px 6px;font-size:11px}
        .weight-box{margin-top:10px;padding:14px;border-radius:7px;background:#fff;color:#374151;font-size:13px;border:1px solid #e5e7eb} 
        .hidden{display:none!important}
        table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff} th,td{border:1px solid #ddd;padding:8px;text-align:center}
        th{background:#f8fafc;font-weight:700}
        .member-info-input{display:flex;flex-direction:column;gap:3px;align-items:center;}
        .member-info-input input { width: 90%; padding:2px 4px; font-size:12px; text-align:center; border:1px solid #ccc; border-radius:3px; }
        .alert-text { color: #ef4444; font-weight: bold; }
        .normal-text { color: #047857; font-weight: bold; }
        .org-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:18px; margin-bottom:20px; }
        .org-card-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
        .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:700; background:#eef2ff; color:#4f46e5; }
        .badge.avg { background:#ecfdf5; color:#047857; }
        @media(max-width:850px){ .app{display:block}.sidebar{width:100%}.nav{display:flex;overflow:auto;padding:8px} .nav button{width:auto;white-space:nowrap;margin:0 4px}.container{padding:20px 14px} }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo">Project<span>Gauge</span></div>
        <nav class="nav">
            <button data-page="dashboard">▦ 대시보드</button>
            <button data-page="projects">▣ 프로젝트</button>
            <button data-page="evaluation" class="active">✓ 기여도 평가</button>
            <button data-page="organization">♙ 조직관리</button>
        </nav>
    </aside>

    <div class="main">
        <header class="topbar">
            <b id="topTitle">기여도 평가</b>
            <div class="actions">
                <button class="btn" id="excelBtn">엑셀 출력</button>
                <button class="btn secondary" id="exportBtn">평가 데이터 내보내기</button>
            </div>
        </header>

        <div class="container">
            <!-- 대시보드 페이지 -->
            <div id="dashboard" class="page hidden">
                <h2>시스템 현황</h2>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px">
                    <div class="weight-box">프로젝트 수: <b id="dashProjects">0</b></div>
                    <div class="weight-box">총 참여인원: <b id="dashMembers">0</b></div>
                    <div class="weight-box">주요과업 수: <b id="dashMajors">0</b></div>
                    <div class="weight-box">세부과업 수: <b id="dashDetails">0</b></div>
                </div>
            </div>

            <!-- 프로젝트 목록 페이지 -->
            <div id="projects" class="page hidden">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h2>프로젝트 목록</h2>
                    <button class="btn" id="addProjectBtn">+ 프로젝트 추가</button>
                </div>
                <table>
                    <thead>
                        <tr><th>프로젝트명</th><th>점수</th><th>인원</th><th>주요과업</th><th>세부과업</th><th>관리</th></tr>
                    </thead>
                    <tbody id="projectRows"></tbody>
                </table>
            </div>

            <!-- 기여도 평가 페이지 -->
            <div id="evaluation" class="page">
                <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px; flex-wrap:wrap">
                    <select id="projectSelect" style="padding:8px; font-size:16px"></select>
                    <button class="btn secondary" id="addMemberBtn">+ 구성원 추가</button>
                    <button class="btn secondary" id="addMajorBtn">+ 주요과업 추가</button>
                </div>
                <div style="background:#fff; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; gap:30px; border:1px solid #ddd; flex-wrap:wrap; align-items:center;">
                    <div>프로젝트: <b id="selectedName">-</b></div>
                    <div>배정점수: <b id="selectedScore">0점</b></div>
                    <div>참여인원: <b id="memberCount">0</b>명</div>
                    <div>세부과업: <b id="detailCount">0</b>개</div>
                    <div>세부과업 가중치 총합: <b id="totalWeightSum">0%</b> (목표: 100%)</div>
                </div>
                <div id="evaluationTable"></div>
            </div>

            <!-- 조직관리 페이지 -->
            <div id="organization" class="page hidden">
                <h2>조직 및 개인별 평가 결과</h2>
                <p style="color:#6b7280; font-size:13px; margin-top:-6px; margin-bottom:20px;">
                    산식: <b>프로젝트 점수 × (세부과업 가중치(%) / 100) × (세부과업 내 개인 투입비율(%) / 100)</b>
                </p>
                <div id="organizationContent"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase 설정
    const firebaseConfig = {
        databaseURL: "https://project-3d765-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = { projects: [] };
    let selectedId = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => s ? String(s).replace(/[&<>\"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])) : '';

    async function save() {
        try {
            await db.ref('projectGaugeData').set(state);
        } catch (e) { console.error("저장 오류:", e); }
    }

    async function load() {
        try {
            const snapshot = await db.ref('projectGaugeData').once('value');
            state = snapshot.val() || { projects: [] };
            if (state.projects.length > 0 && !selectedId) {
                selectedId = state.projects[0].id;
            }
            return state;
        } catch (e) { return { projects: [] }; }
    }

    db.ref('projectGaugeData').on('value', (snapshot) => {
        state = snapshot.val() || { projects: [] };
        if (state.projects.length > 0 && (!selectedId || !state.projects.some(p => p.id === selectedId))) {
            selectedId = state.projects[0].id;
        }
        renderAll();
    });

    function nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; }
    function project() { return state.projects.find(p => p.id === selectedId); }
    function allDetails(p) { return p.majors ? p.majors.flatMap(m => m.details || []) : []; }

    function calcMemberProjectScore(p, memberId) {
        const projScore = Number(p.score) || 0;
        const details = allDetails(p);
        return details.reduce((sum, det) => {
            const weightRatio = (Number(det.weight) || 0) / 100;
            const inputRatio = (det.values && det.values[memberId] ? Number(det.values[memberId]) : 0) / 100;
            return sum + (projScore * weightRatio * inputRatio);
        }, 0);
    }

    function renderAll() {
        renderDashboard();
        renderProjects();
        renderEvaluation();
        renderOrganization();
    }

    function showPage(page) {
        document.querySelectorAll(".page").forEach(x => x.classList.add("hidden"));
        $(page).classList.remove("hidden");
        document.querySelectorAll(".nav button").forEach(x => {
            x.classList.toggle("active", x.dataset.page === page);
        });
        $("topTitle").textContent = { dashboard: "대시보드", projects: "프로젝트", evaluation: "기여도 평가", organization: "조직관리" }[page];
        if (page === "organization") renderOrganization();
    }

    function renderDashboard() {
        $("dashProjects").textContent = state.projects.length;
        $("dashMembers").textContent = state.projects.reduce((n, p) => n + (p.members ? p.members.length : 0), 0);
        $("dashMajors").textContent = state.projects.reduce((n, p) => n + (p.majors ? p.majors.length : 0), 0);
        $("dashDetails").textContent = state.projects.reduce((n, p) => n + allDetails(p).length, 0);
    }

    function renderProjects() {
        $("projectRows").innerHTML = state.projects.length ? state.projects.map(p => `
            <tr>
                <td><input class="edit" data-name="${p.id}" value="${esc(p.name)}"></td>
                <td><input type="number" data-score="${p.id}" value="${p.score}"> 점</td>
                <td>${p.members ? p.members.length : 0}</td>
                <td>${p.majors ? p.majors.length : 0}</td>
                <td>${allDetails(p).length}</td>
                <td>
                    <button class="btn secondary small" data-open="${p.id}">평가표 열기</button>
                    <button class="btn danger small" data-remove="${p.id}">삭제</button>
                </td>
            </tr>
        `).join("") : `<tr><td colspan="6">프로젝트를 추가해 주세요.</td></tr>`;

        document.querySelectorAll("[data-name]").forEach(i => i.onchange = () => {
            const p = state.projects.find(x => x.id == i.dataset.name);
            if (p) { p.name = i.value; save(); renderOrganization(); }
        });
        document.querySelectorAll("[data-score]").forEach(i => i.onchange = () => {
            const p = state.projects.find(x => x.id == i.dataset.score);
            if (p) { p.score = Number(i.value); save(); renderOrganization(); }
        });
        document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
            selectedId = Number(b.dataset.open);
            showPage("evaluation");
            renderEvaluation();
        });
        document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => {
            if (!confirm("삭제하시겠습니까?")) return;
            state.projects = state.projects.filter(p => p.id != Number(b.dataset.remove));
            if (selectedId === Number(b.dataset.remove)) {
                selectedId = state.projects.length ? state.projects[0].id : null;
            }
            save(); renderAll();
        });
    }

    function renderEvaluation() {
        $("projectSelect").innerHTML = state.projects.map(p => `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name || "새 프로젝트")}</option>`).join("");

        const p = project();
        if (!p) {
            $("selectedName").textContent = "-";
            $("selectedScore").textContent = "0점";
            $("memberCount").textContent = "0";
            $("detailCount").textContent = "0";
            $("totalWeightSum").textContent = "0%";
            $("evaluationTable").innerHTML = "프로젝트를 먼저 추가해 주세요.";
            return;
        }

        $("selectedName").textContent = p.name || "-";
        $("selectedScore").textContent = (p.score || 0) + "점";
        $("memberCount").textContent = p.members ? p.members.length : 0;
        $("detailCount").textContent = allDetails(p).length;

        if (!p.majors) p.majors = [];
        if (!p.members) p.members = [];

        const details = allDetails(p);
        const totalWeight = details.reduce((sum, d) => sum + (Number(d.weight) || 0), 0);
        const weightSumElem = $("totalWeightSum");
        weightSumElem.textContent = totalWeight + "%";
        weightSumElem.className = totalWeight !== 100 ? "alert-text" : "normal-text";

        // 각 팀원별 투입비율 총합 계산 (테이블 상단 헤더 표시용)
        const memberInputSums = {};
        p.members.forEach(m => {
            memberInputSums[m.id] = details.reduce((sum, det) => {
                return sum + (det.values && det.values[m.id] ? Number(det.values[m.id]) : 0);
            }, 0);
        });

        let html = `<table><thead><tr><th>주요과업</th><th>세부과업</th><th>가중치(%)</th><th>투입비율 합계</th>`;
        
        p.members.forEach(m => { 
            const mSum = memberInputSums[m.id] || 0;
            html += `<th>
                <div class="member-info-input">
                    <input type="text" data-dept="${m.id}" value="${esc(m.dept || '')}" placeholder="부서">
                    <input type="text" data-rank="${m.id}" value="${esc(m.rank || '')}" placeholder="직급">
                    <input type="text" data-mname="${m.id}" value="${esc(m.name || '')}" placeholder="이름">
                    <div style="font-size:11px; margin-top:2px; font-weight:normal;">총합: <b style="color:#4f46e5;">${mSum}%</b></div>
                    <button class="btn danger small" data-remove-mem="${m.id}" style="margin-top:2px;">팀원 삭제</button>
                </div>
            </th>`; 
        });
        html += `<th>관리</th></tr></thead><tbody>`;

        if (p.majors.length === 0) {
            html += `<tr><td colspan="${4 + p.members.length}">상단의 '+ 주요과업 추가' 버튼을 눌러 과업을 등록해주세요.</td></tr>`;
        } else {
            p.majors.forEach(maj => {
                if (!maj.details) maj.details = [];
                if (maj.details.length === 0) {
                    html += `<tr><td><b>${esc(maj.name)}</b></td><td colspan="${3 + p.members.length}">세부과업이 없습니다. <button class="btn small" data-add-det="${maj.id}">+ 세부과업 추가</button></td></tr>`;
                } else {
                    maj.details.forEach((det, idx) => {
                        const rowInputSum = p.members.reduce((sum, m) => sum + (det.values && det.values[m.id] ? Number(det.values[m.id]) : 0), 0);
                        const rowSumClass = rowInputSum === 100 ? "normal-text" : "alert-text";

                        html += `<tr>`;
                        if (idx === 0) {
                            html += `<td rowspan="${maj.details.length}"><b>${esc(maj.name)}</b><br><button class="btn small secondary" data-add-det="${maj.id}" style="margin-top:5px">+ 세부과업</button></td>`;
                        }
                        html += `<td>${esc(det.name)}</td>`;
                        html += `<td><input type="number" data-weight="${det.id}" value="${det.weight || 0}" style="width:60px"></td>`;
                        html += `<td><span class="${rowSumClass}">${rowInputSum}%</span></td>`;
                        
                        p.members.forEach(m => {
                            if (!det.values) det.values = {};
                            html += `<td><input type="number" data-val="${det.id}-${m.id}" value="${det.values[m.id] || 0}" style="width:60px" placeholder="0"></td>`;
                        });
                        html += `<td><button class="btn danger small" data-remove-det="${det.id}">삭제</button></td></tr>`;
                    });
                }
            });
        }
        html += `</tbody></table>`;
        $("evaluationTable").innerHTML = html;

        // 이벤트 바인딩
        document.querySelectorAll("[data-weight]").forEach(i => i.onchange = () => {
            const det = allDetails(p).find(x => x.id == i.dataset.weight);
            if (det) { det.weight = Number(i.value); save(); renderEvaluation(); renderOrganization(); }
        });
        document.querySelectorAll("[data-val]").forEach(i => i.onchange = () => {
            const [detId, memId] = i.dataset.val.split('-');
            const det = allDetails(p).find(x => x.id == detId);
            if (det) {
                if (!det.values) det.values = {};
                det.values[memId] = Number(i.value);
                save(); renderEvaluation(); renderOrganization();
            }
        });
        document.querySelectorAll("[data-dept]").forEach(i => i.onchange = () => {
            const m = p.members.find(x => x.id == i.dataset.dept);
            if (m) { m.dept = i.value; save(); renderOrganization(); }
        });
        document.querySelectorAll("[data-rank]").forEach(i => i.onchange = () => {
            const m = p.members.find(x => x.id == i.dataset.rank);
            if (m) { m.rank = i.value; save(); renderOrganization(); }
        });
        document.querySelectorAll("[data-mname]").forEach(i => i.onchange = () => {
            const m = p.members.find(x => x.id == i.dataset.mname);
            if (m) { m.name = i.value; save(); renderOrganization(); }
        });
        document.querySelectorAll("[data-remove-mem]").forEach(b => b.onclick = () => {
            const memId = Number(b.dataset.removeMem);
            p.members = p.members.filter(m => m.id !== memId);
            save(); renderEvaluation(); renderOrganization();
        });
        document.querySelectorAll("[data-add-det]").forEach(b => b.onclick = () => {
            const maj = p.majors.find(x => x.id == Number(b.dataset.addDet));
            if (maj) {
                if (!maj.details) maj.details = [];
                maj.details.push({ id: nextId(allDetails(p)), name: "새 세부과업", weight: 0, values: {} });
                save(); renderEvaluation(); renderOrganization();
            }
        });
        document.querySelectorAll("[data-remove-det]").forEach(b => b.onclick = () => {
            const detId = Number(b.dataset.removeDet);
            p.majors.forEach(maj => {
                if (maj.details) {
                    maj.details = maj.details.filter(d => d.id !== detId);
                }
            });
            save(); renderEvaluation(); renderOrganization();
        });
    }

    function renderOrganization() {
        const container = $("organizationContent");
        if (!state.projects || state.projects.length === 0) {
            container.innerHTML = `<div class="org-card">등록된 프로젝트가 없습니다. 프로젝트 탭에서 먼저 프로젝트를 추가해 주세요.</div>`;
            return;
        }

        const personMap = new Map();
        state.projects.forEach(p => {
            const members = p.members || [];
            members.forEach(m => {
                const key = `${(m.dept || '').trim()}|${(m.rank || '').trim()}|${(m.name || '').trim()}`;
                const score = calcMemberProjectScore(p, m.id);
                if (!personMap.has(key)) {
                    personMap.set(key, {
                        dept: m.dept || '-',
                        rank: m.rank || '-',
                        name: m.name || '-',
                        projectCount: 0,
                        totalScore: 0
                    });
                }
                const entry = personMap.get(key);
                entry.projectCount += 1;
                entry.totalScore += score;
            });
        });

        let html = `
            <div class="org-card">
                <div class="org-card-header">
                    <h3 style="margin:0;">전체 구성원 누적 점수 요약</h3>
                    <span class="badge">총 ${personMap.size}명</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>부서</th>
                            <th>직급</th>
                            <th>이름</th>
                            <th>참여 프로젝트 수</th>
                            <th>누적 점수 합계</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        if (personMap.size === 0) {
            html += `<tr><td colspan="5">등록된 구성원이 없습니다.</td></tr>`;
        } else {
            personMap.forEach(person => {
                html += `
                    <tr>
                        <td>${esc(person.dept)}</td>
                        <td>${esc(person.rank)}</td>
                        <td><b>${esc(person.name)}</b></td>
                        <td>${person.projectCount}개</td>
                        <td class="normal-text">${person.totalScore.toFixed(2)}점</td>
                    </tr>
                `;
            });
        }
        html += `</tbody></table></div>`;

        html += `<h3 style="margin-top:28px; margin-bottom:12px;">프로젝트별 개인 점수 및 현황</h3>`;

        state.projects.forEach(p => {
            const members = p.members || [];
            const memberScores = members.map(m => ({
                ...m,
                earnedScore: calcMemberProjectScore(p, m.id)
            }));

            const totalEarned = memberScores.reduce((sum, m) => sum + m.earnedScore, 0);
            const avgScore = members.length > 0 ? (totalEarned / members.length) : 0;
            const projScore = Number(p.score) || 0;

            html += `
                <div class="org-card">
                    <div class="org-card-header">
                        <div>
                            <b style="font-size:16px;">${esc(p.name || '새 프로젝트')}</b>
                            <span style="color:#6b7280; font-size:13px; margin-left:8px;">(프로젝트 총 배정점수: ${projScore}점)</span>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="badge">참여인원: ${members.length}명</span>
                            <span class="badge avg">인원 평균: ${avgScore.toFixed(2)}점</span>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>부서</th>
                                <th>직급</th>
                                <th>이름</th>
                                <th>개인별 획득 점수</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (memberScores.length === 0) {
                html += `<tr><td colspan="4">이 프로젝트에 배정된 구성원이 없습니다.</td></tr>`;
            } else {
                memberScores.forEach(m => {
                    html += `
                        <tr>
                            <td>${esc(m.dept || '-')}</td>
                            <td>${esc(m.rank || '-')}</td>
                            <td><b>${esc(m.name || '-')}</b></td>
                            <td class="normal-text">${m.earnedScore.toFixed(2)}점</td>
                        </tr>
                    `;
                });
                html += `
                    <tr style="background:#f8fafc; font-weight:bold;">
                        <td colspan="3">전체 참여자 획득 점수 합계 (목표 총점: ${projScore}점)</td>
                        <td style="color:${Math.abs(totalEarned - projScore) < 0.01 ? '#047857' : '#ef4444'};">
                            ${totalEarned.toFixed(2)}점 
                        </td>
                    </tr>
                `;
            }
            html += `</tbody></table></div>`;
        });

        container.innerHTML = html;
    }

    function exportToExcel() {
        const p = project();
        if (!p) return alert("출력할 프로젝트가 선택되지 않았습니다.");

        const excelData = [];
        excelData.push(["프로젝트명", p.name, "총 배정점수", p.score]);
        excelData.push([]);

        const headerRow = ["주요과업", "세부과업", "가중치(%)"];
        const members = p.members || [];
        members.forEach(m => {
            headerRow.push(`${m.dept || ''} / ${m.rank || ''} / ${m.name || ''}`);
        });
        excelData.push(headerRow);

        if (p.majors) {
            p.majors.forEach(maj => {
                if (maj.details) {
                    maj.details.forEach(det => {
                        const row = [
                            maj.name || '',
                            det.name || '',
                            (det.weight || 0) + '%'
                        ];
                        members.forEach(m => {
                            const val = det.values && det.values[m.id] ? det.values[m.id] : 0;
                            row.push(val + '%');
                        });
                        excelData.push(row);
                    });
                }
            });
        }

        excelData.push([]);
        excelData.push(["[조직관리 및 개인별 획득 점수 결과]"]);
        excelData.push(["부서", "직급", "이름", "획득 점수"]);

        members.forEach(m => {
            const earned = calcMemberProjectScore(p, m.id);
            excelData.push([m.dept || '-', m.rank || '-', m.name || '-', Number(earned.toFixed(2))]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "기여도평가결과");

        const fileName = `${p.name || '프로젝트'}_기여도평가.xlsx`;
        XLSX.writeFile(workbook, fileName);
    }

    window.onload = async () => {
        await load();
        renderAll();
        document.querySelectorAll(".nav button").forEach(b => b.onclick = () => showPage(b.dataset.page));
        $("projectSelect").onchange = (e) => { 
            selectedId = Number(e.target.value); 
            renderEvaluation(); 
        };
        $("addProjectBtn").onclick = () => {
            const p = { id: nextId(state.projects), name: "새 프로젝트", score: 100, members: [], majors: [] };
            state.projects.push(p); selectedId = p.id; save(); renderAll();
        };
        $("addMemberBtn").onclick = () => {
            const p = project(); if(!p) return alert("프로젝트를 선택하세요.");
            if (!p.members) p.members = [];
            p.members.push({ id: nextId(p.members), dept: "부서명", rank: "직급", name: "이름" });
            save(); renderEvaluation(); renderOrganization();
        };
        $("addMajorBtn").onclick = () => {
            const p = project(); if(!p) return alert("프로젝트를 선택하세요.");
            if (!p.majors) p.majors = [];
            const newMajId = nextId(p.majors);
            p.majors.push({ id: newMajId, name: "주요과업명", details: [{ id: nextId(allDetails(p)), name: "세부과업명", weight: 0, values: {} }] });
            save(); renderEvaluation(); renderOrganization();
        };
        
        $("excelBtn").onclick = exportToExcel;

        $("exportBtn").onclick = () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "eval_data.json"; a.click();
        };
    };
</script>
